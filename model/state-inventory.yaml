# Both machines are held in the same state store; the store is authoritative
# for every state below. `BlockedFinal` occurs in BOTH machines with different
# exits — always qualify it by machine.

machines:
  revision:
    count: 21
    states:
      - name: "AwaitingBrief"
        meaning: "The course record exists; no brief yet."
        editor_can_do: "Write the brief, discard the draft"
      - name: "BriefValidation"
        meaning: "The input is checked in three hops: JSON schema → OPA (role, limits) → guardrail (denied topics, PII)."
        editor_can_do: "Wait; read the refusal reason"
      - name: "BriefFeasibility"
        meaning: "Z3 pre-flight: are the brief's requirements mutually satisfiable at all?"
        editor_can_do: "On unsat — read the core and fix the brief"
      - name: "OutlineDrafting"
        meaning: "The model proposes the structure through a forced JSON schema."
        editor_can_do: "Cancel the run"
      - name: "OutlineGuardrail"
        meaning: "The managed guardrail screens the produced outline text."
        editor_can_do: "Wait"
      - name: "OutlineChecks"
        meaning: "Schema, Datalog (skills grounded, no prerequisite cycles), OPA (structural policy), Z3 (counts and budgets)."
        editor_can_do: "Wait"
      - name: "OutlineRepair"
        meaning: "Bounded repair: the formal explanation is fed back into the prompt, retry ≤ 2."
        editor_can_do: "Watch the repair; abort"
      - name: "OutlineReview"
        meaning: "Human. The editor rewrites, renames, deletes, and approves the skeleton — before any content is paid for."
        editor_can_do: "Edit, approve, reject with notes"
      - name: "ContentInProgress"
        meaning: "The long phase. An aggregate of node states; the editor comes and goes."
        editor_can_do: "Pick a node, generate, edit, approve"
      - name: "ReadyForReview"
        meaning: "Guard satisfied: every node approved, none stale."
        editor_can_do: "Start the course-level checks"
      - name: "WholeCourseChecks"
        meaning: "Completeness, ordering, consistency, LTL over the trace, a permission sweep across all sources used."
        editor_can_do: "Wait; on failure see which nodes are at fault"
      - name: "PendingApproval"
        meaning: "Human. The final publication decision, with everything the approver needs on screen."
        editor_can_do: "Approve, reject with notes"
      - name: "Approved"
        meaning: "Approved and stamped with the policy, guardrail, catalog, and model versions it passed under."
        editor_can_do: "Publish, or send back to work"
      - name: "Published"
        meaning: "Live for its audience, and immutable: no transition edits its content. A change forks a new revision beside it."
        editor_can_do: "Request a revision; withdraw it"
      - name: "StaleReview"
        meaning: "New in v2. A revision is being re-verified against the current versions — because a policy, catalog, or source change touched it, or because a rollback wants to put it back on air. It is never rewritten here, only re-judged."
        editor_can_do: "Wait for the re-check; withdraw early"
      - name: "Withdrawn"
        meaning: "New. Out of service: re-verification failed, so this revision no longer serves — and unlike Superseded, readers part-way through lose access, because a rule violation is exactly the case where letting them finish defeats the purpose. The explanation names what changed. If no earlier revision can pass re-verification either, the course serves nothing at all: that is an accepted outcome, not a gap — withdrawal is never refused for want of a replacement, or availability would start outranking compliance."
        editor_can_do: "Request a revision that complies"
      - name: "Superseded"
        meaning: "New. A later revision took the live pointer. Kept intact, still stamped, still readable by learners who started on it. Quasi-terminal: the only way back into service is a rollback, and only through re-verification; it can also be swept by a policy change while readers remain, or retired outright. Learners who started on it finish on it, within a bounded window."
        editor_can_do: "Read; request a rollback"
      - name: "Archived"
        meaning: "Terminal: deliberately retired, kept for audit."
        editor_can_do: "Clone as the basis for a new course"
      - name: "BlockedFinal"
        meaning: "Terminal, with no unblock path: a policy violation (OPA deny or a denied topic). An admin does not reopen it — they start a new brief, because a terminal state an admin can undo is terminal in name only. Carries the deny reason and the audit entry."
        editor_can_do: "Read only"
      - name: "BlockedRecoverable"
        meaning: "The process stopped and needs a human move: retries exhausted, a contradictory brief, a rights refusal."
        editor_can_do: "Fix the input and re-enter the relevant state"
      - name: "ErrorRecovery"
        meaning: "Infrastructure trouble: a model error or a timeout — an unknown, not a failure."
        editor_can_do: "Wait; cancel"
  node:
    count: 11
    states:
      - name: "Planned"
        meaning: "From the approved skeleton: a title and learning objectives, nothing else."
        exit: "The editor starts generation"
      - name: "ContentDrafting"
        meaning: "Retrieval scoped to this topic; the model assembles blocks against the catalog's schemas."
        exit: "→ Generated"
      - name: "Generated"
        meaning: "A draft exists and nothing has checked it yet."
        exit: "→ OutputGuardrail"
      - name: "OutputGuardrail"
        meaning: "New in v2. The managed guardrail screens the generated text and any generated image."
        exit: "Clean → NodeChecks · unsafe → NodeRepair"
      - name: "NodeChecks"
        meaning: "Block schemas · grounding (Datalog) · rights over the chunk IDs used · arithmetic (Z3) · objective coverage (Prolog)."
        exit: "Pass → Validated · violation → NodeRepair · policy → BlockedFinal"
      - name: "NodeRepair"
        meaning: "The unsat core, deny reason, or proof tree is fed back into the prompt; retry ≤ 2."
        exit: "Budget left → ContentDrafting · spent → BlockedRecoverable"
      - name: "Validated"
        meaning: "Formally clean, waiting on a person."
        exit: "→ NodeApproved"
      - name: "NodeApproved"
        meaning: "Human. The editor approved this node; versions are stamped onto it."
        exit: "An edit → NeedsRevalidation"
      - name: "NeedsRevalidation"
        meaning: "This node or something it depends on changed — including a node it points at leaving the skeleton; the approval is honestly withdrawn."
        exit: "Hand-edited → OutputGuardrail · otherwise → NodeChecks"
      - name: "BlockedFinal"
        meaning: "A policy violation. Nothing the machine does moves it — no retry, no re-check, no repair."
        exit: "Only removal, and only by a person"
      - name: "Removed"
        meaning: "New. The editor committed a skeleton that no longer contains this node. Terminal, and deliberately not a failure: the record, its trace and its stamps are kept for audit, but the node is no longer part of the course and no guard counts it. Re-adding a node with the same title creates a different one — the same rule that makes an edit fork rather than overwrite."
        exit: "—"
